[config-data]
# EPStudio HTTP API address
host = http://<EPSTUDIO_HOST_IP>
port = 8080

# EPStudio websocket push service address
websocket_host = ws://<EPSTUDIO_HOST_IP>
websocket_port = 9000

login_id = admin
password = admin
guinea_pig_id = <GUINEA_PIG_ID>

# Optional SDK-side server used by selected examples
server_host = 0.0.0.0
server_port = 8088

[app]
# Assigned device MAC address
device_mac = <DEVICE_MAC>

# Both names are supported by the realtime scripts.
channel = 1,2,3,4,5
channels = 1,2,3,4,5

display_points = 1000
